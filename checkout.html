<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — STILL.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">STILL.</a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="#">Journal</a>
        <a href="cart.html" class="cart-link">
          Cart <span class="cart-count" data-cart-count>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- Checkout view -->
    <div data-checkout-view>
      <h1 class="page-title">Checkout</h1>

      <form class="checkout-layout" id="checkout-form" novalidate>

        <!-- LEFT: form fields -->
        <div>
          <section class="form-section">
            <h2>Contact</h2>
            <div class="form-grid">
              <div class="field full">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
            </div>
          </section>

          <section class="form-section">
            <h2>Shipping address</h2>
            <div class="form-grid">
              <div class="field">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" required />
              </div>
              <div class="field">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" required />
              </div>
              <div class="field full">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required />
              </div>
              <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required />
              </div>
              <div class="field">
                <label for="zip">Postal code</label>
                <input type="text" id="zip" name="zip" required />
              </div>
              <div class="field full">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                  <option value="">Select…</option>
                  <option>Pakistan</option>
                  <option>United States</option>
                  <option>United Kingdom</option>
                  <option>Germany</option>
                  <option>Japan</option>
                </select>
              </div>
            </div>
          </section>

          <section class="form-section">
            <h2>Payment</h2>
            <div class="form-grid">
              <div class="field full">
                <label for="cardName">Name on card</label>
                <input type="text" id="cardName" name="cardName" required />
              </div>
              <div class="field full">
                <label for="cardNumber">Card number</label>
                <input type="text" id="cardNumber" name="cardNumber"
                       inputmode="numeric" placeholder="1234 5678 9012 3456" required />
              </div>
              <div class="field">
                <label for="expiry">Expiry (MM/YY)</label>
                <input type="text" id="expiry" name="expiry" placeholder="08/28" required />
              </div>
              <div class="field">
                <label for="cvc">CVC</label>
                <input type="text" id="cvc" name="cvc" inputmode="numeric" required />
              </div>
            </div>
          </section>

          <button type="submit" class="btn btn-accent btn-block form-data" data-place-order>
            Place order
          </button>
        </div>

        <!-- RIGHT: order summary -->
        <aside class="order-summary">
          <h2>Order summary</h2>
          <div data-order-lines>
            <!-- Render one .order-line per cart item in JS -->
           </div>
          <div class="summary-row" style="margin-top: 1rem;">
            <span>Subtotal</span>
            <span>$<span data-subtotal>0.00</span></span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>$<span data-shipping>0.00</span></span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>$<span data-total>0.00</span></span>
          </div>
        </aside>

      </form>
    </div>

    <!-- Success view — show after order is placed -->
    <div class="success-state hidden" data-success-view>
      <h1>Thank you for your order.</h1>
      <p>A confirmation has been sent to your email.</p>
      <a href="index.html" class="btn btn-ghost">Back to shop</a>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">© STILL. — A starter exercise template.</div>
  </footer>

  <!-- TODO (exercise): include your cart.js here -->
  <script src="./cart.js"></script>
</body>
</html>
