<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — STILL.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="brand">STILL.</a>
        <nav class="nav">
          <a href="index.html">Shop</a>
          <a href="#">Journal</a>
          <a href="cart.html" class="cart-link active">
            Cart <span class="cart-count" data-cart-count>0</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1 class="page-title">Your cart</h1>

      <div class="cart-layout">
        <!-- LEFT: items list -->
        <section>
          <!-- Empty state — show this when cart is empty -->
          <div class="cart-empty" data-cart-empty>
            <p>Your cart is empty.</p>
            <p style="margin-top: 1rem">
              <a href="index.html" class="btn btn-ghost">Continue shopping</a>
            </p>
          </div>

          <!-- Items list — render cart items into here -->
          <div class="cart-items" data-cart-items>
            <!--
            REFERENCE: cart item markup. Clone / build this dynamically in JS.
            Remove this static example once you wire it up.
          -->
            <article class="cart-item" data-product-id="${item.id}">
              <!-- <div class="thumb">
                <img src="https://picsum.photos/seed/mug/200/200" alt="" />
              </div>
              <div class="info">
                <div class="name">Stoneware Mug</div>
                <div class="price">$28.00</div>
              </div>
              <div class="controls">
                <div class="qty-stepper">
                  <button data-qty-decrease aria-label="Decrease">−</button>
                  <span class="qty" data-qty>1</span>
                  <button data-qty-increase aria-label="Increase">+</button>
                </div>
                <button class="remove-item" data-remove-item>Remove</button>
              </div> -->
            </article>
          </div>
        </section>

        <!-- RIGHT: summary -->
        <aside class="cart-summary">
          <h2>Summary</h2>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$<span data-subtotal>0.00</span></span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>$<span data-shipping>0.00</span></span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>$<span data-total>0.00</span></span>
          </div> 
           <a
            href="checkout.html"
            class="btn btn-accent btn-block"
            style="margin-top: 1.5rem"
            data-checkout-btn
          >
            Checkout
          </a> 
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">© STILL. — A starter exercise template.</div>
    </footer>

    <!-- TODO (exercise): include your cart.js here -->
    <script src="./cart.js">
    


    </script>
  </body>
</html>
